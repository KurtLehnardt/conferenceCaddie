# Versions chosen on 2026-11-10. Kotlin 2.4.21 is the newest stable Kotlin; its Gradle plugin is
# documented as compatible with Gradle up to 9.7 and AGP up to 9.3, so AGP stays on the newest 9.3
# patch even though AGP 9.5.1 exists. Compose Multiplatform 1.12.2 pairs with Material3
# 1.12.0-alpha03 and Lifecycle 2.11.0 in its release notes.
#
# compileSdk is 37 because Compose 1.12 and Lifecycle 2.11 refuse to build against anything older.
# targetSdk stays at 36: compileSdk only decides which APIs the code can see, while targetSdk decides
# which runtime behaviour changes the app opts in to.
#
# UI tests (added 2026-11-10 with the design system): Compose Multiplatform's ui-test runs the same
# commonTest UI tests on the iOS simulator and, through the Android device test source set, on an
# Android emulator. Its Android side is Jetpack Compose ui-test 1.12.1, the Jetpack release that
# Compose Multiplatform 1.12.2 builds on, so the Jetpack test artifacts use that version. AndroidX
# Test is on its newest stable releases.
#
# navigationevent-compose is the back-event library that Compose Multiplatform's BackHandler is
# built on (ui-backhandler 1.12.2 depends on 1.1.0). The iOS UI tests use it directly, to send the
# system Back through the dispatcher that the iOS edge swipe also uses.
[versions]
agp = "9.3.3"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-compose-test = "1.12.1"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
compose-material-icons = "1.7.3"
compose-material3 = "1.12.0-alpha03"
compose-multiplatform = "1.12.2"
jetbrains-navigationevent = "1.1.0"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
androidx-compose-uiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-test" }
androidx-compose-uiTestManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-test" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
jetbrains-navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "jetbrains-navigationevent" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
