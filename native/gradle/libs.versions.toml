# Versions chosen on 2026-11-10. Kotlin 2.4.21 is the newest stable Kotlin; its Gradle plugin is
# documented as compatible with Gradle up to 9.7 and AGP up to 9.3, so AGP stays on the newest 9.3
# patch even though AGP 9.5.1 exists. Compose Multiplatform 1.12.2 pairs with Material3
# 1.12.0-alpha03 and Lifecycle 2.11.0 in its release notes.
#
# compileSdk is 37 because Compose 1.12 and Lifecycle 2.11 refuse to build against anything older.
# targetSdk stays at 36: compileSdk only decides which APIs the code can see, while targetSdk decides
# which runtime behaviour changes the app opts in to.
#
# Phase 2a (2026-11-10) adds the network, storage and time libraries of the shared core:
# - Ktor 3.6.1, the newest release, built against kotlinx.coroutines 1.11.0 like the rest of the
#   app. The OkHttp engine serves Android and the JVM tests; the Darwin engine (NSURLSession) serves
#   iOS, so App Transport Security applies there.
# - kotlinx-io: the bundle cache uses its file system API. 0.9.1 was the version Ktor 3.6.1 itself
#   depends on. 0.9.2 (2026-11-12, Dependabot) reimplements the Kotlin/Native FileSink and FileSource,
#   the iOS path of the bundle cache that BundleSyncTest covers, and fixes a crash on a zero-byte
#   read or write (kotlinx-io #529).
# - androidx.sqlite 2.7.1, the newest stable release. Its bundled driver compiles SQLite with FTS5
#   for Android, iOS and the JVM, so search behaves the same everywhere.
# - kotlinx-datetime supplies time zones for "today in the conference's time zone". 0.7.1 was the
#   version Compose (Material3) brings in. No symbol of 0.7.1 is missing from 0.8.0 (2026-11-12,
#   Dependabot): the diff of the JVM and klib ABI dumps removes no line. Its one breaking change, the
#   deprecation of TimeZone serialization (a warning), touches nothing the app uses.
# Lifecycle's ViewModel for Compose (phase 2a review, 2026-11-10) keeps the Search screen's state
# across an Android configuration change; it is the same Lifecycle 2.11.0 release as the runtime.
# Phase 2b (2026-11-10) adds ONNX Runtime for the on-device query embedding (bge-small-en-v1.5):
# - 1.30.0 on every platform, so Android, iOS and the JVM tests run the same runtime. 1.31.1 exists
#   on Maven Central, but Microsoft has published no iOS archive for 1.31 (the download of
#   pod-archive-onnxruntime-c-1.31.x.zip answers 404), and 1.30.0 is the newest release with one.
# - onnxruntime-android (the full build, with every operator) on Android, the CPU package
#   onnxruntime on the JVM, where only the tests use it, and the C API static xcframework on iOS
#   through cinterop (gradle/pinned-downloads.properties pins that archive).
# UI tests (added 2026-11-10 with the design system): Compose Multiplatform's ui-test runs the same
# commonTest UI tests on the iOS simulator and, through the Android device test source set, on an
# Android emulator. Its Android side is Jetpack Compose ui-test 1.12.1, the Jetpack release that
# Compose Multiplatform 1.12.2 builds on, so the Jetpack test artifacts use that version. AndroidX
# Test is on its newest stable releases.
#
# navigationevent-compose is the back-event library that Compose Multiplatform's BackHandler is
# built on (ui-backhandler 1.12.2 depends on 1.1.0). The iOS UI tests use it directly, to send the
# system Back through the dispatcher that the iOS edge swipe also uses.
[versions]
agp = "9.3.3"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-compose-test = "1.12.1"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
compose-material-icons = "1.7.3"
compose-material3 = "1.12.0-alpha03"
compose-multiplatform = "1.12.2"
jetbrains-navigationevent = "1.1.0"
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"
kotlinx-datetime = "0.8.0"
kotlinx-io = "0.9.2"
ktor = "3.6.1"
androidx-sqlite = "2.7.1"
onnxruntime = "1.30.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
androidx-compose-uiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-test" }
androidx-compose-uiTestManifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-test" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
jetbrains-navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "jetbrains-navigationevent" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
onnxruntime-jvm = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
