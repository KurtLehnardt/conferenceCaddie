# Files the build downloads that are not Maven artifacts, each pinned to a URL, a size and a SHA-256.
# The build refuses a file whose size or SHA-256 differs, so a changed upstream file fails the build
# instead of reaching an app. Downloads are kept in Gradle's user home under their SHA-256, so they
# are fetched once per machine (and once per CI cache).
#
# The query embedding model (docs/contracts/talk-bundle.md, Embedding conventions): bge-small-en-v1.5
# from the Xenova ONNX export at the revision the bundle builder pins (scripts/lib/embedder.mjs,
# ONNX_REVISION). The apps run onnx/model_quantized.onnx, the int8 export whose query-by-talk
# cosines the contract fixture records as similarities_q8; the bundle builder embeds talks with the
# fp32 onnx/model.onnx of the same revision. The SHA-256 of both files is the LFS object id that
# Hugging Face lists for that revision; vocab.txt matches its git blob id there
# (fb140275c155a9c7c5a3b3e0e77a9e839594a938). Checked on 2026-11-10.
embedding.model.url=https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/ea104dacec62c0de699686887e3f920caeb4f3e3/onnx/model_quantized.onnx
embedding.model.bytes=34014426
embedding.model.sha256=6c9c6101a956d62dfb5e7190c538226c0c5bb9cb27b651234b6df063ee7dbfe4
embedding.vocab.url=https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/ea104dacec62c0de699686887e3f920caeb4f3e3/vocab.txt
embedding.vocab.bytes=231508
embedding.vocab.sha256=07eced375cec144d27c900241f3e339478dec958f92fddbc551f295c992038a3

# ONNX Runtime for iOS: the C API as a static xcframework, the archive the official onnxruntime-c
# CocoaPod (podspec 1.30.0) and Microsoft's Swift package download. Its version must equal
# `onnxruntime` in libs.versions.toml, which the Android and JVM builds use. The podspec carries no
# checksum, so the SHA-256 was recorded from the file on 2026-11-10.
onnxruntime.apple.url=https://download.onnxruntime.ai/pod-archive-onnxruntime-c-1.30.0.zip
onnxruntime.apple.bytes=63965603
onnxruntime.apple.sha256=e6f1670c14406fd9f082bb400ab197a9b0a9646058ca6366e440642e2b54a2ea
