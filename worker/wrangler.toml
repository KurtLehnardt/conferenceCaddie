# The Worker serves the web app and the API from one origin: https://conference-caddie.<subdomain>.workers.dev.
name = "conference-caddie"
main = "src/index.js"
compatibility_date = "2026-11-01"
# node:crypto and Buffer for the Bluetooth derived-token reference code (contracts/js/ble-token.mjs).
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# account_id is not set here; wrangler reads CLOUDFLARE_ACCOUNT_ID from the environment.

# The web app, built in Worker mode (npm --prefix web run build:worker, which writes base "/" and a
# same-origin API). Static files are served by Cloudflare's asset layer without invoking this
# Worker, so they cost no Worker request and never touch the pace budget. Paths with no file get
# index.html (the app routes such as /e/{slug}). Only the paths in run_worker_first reach the
# Worker's code. The response headers of the static files (the Content-Security-Policy, the other
# security headers and Cache-Control) come from web/dist-worker/_headers, which the Worker-mode
# build writes (web/vite.config.ts).
[assets]
directory = "../web/dist-worker"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /index.html is served as it is, not redirected to "/": the service worker precaches /index.html,
# and a redirected response cannot answer a navigation, which would break the offline fallback.
html_handling = "none"
# /__scheduled is the local Cron Trigger test route of `wrangler dev --test-scheduled`; deployed,
# it answers 404 like any unknown path the Worker sees.
run_worker_first = ["/api", "/api/*", "/admin", "/admin/*", "/__scheduled"]

[ai]
binding = "AI"
# Workers AI has no local simulator. `wrangler dev --local` cannot call it at all ("Binding AI
# needs to be run remotely"), so local runs either set EMBED_FAKE=1 in .dev.vars (the binding is
# never called) or, with `scripts/dev-vars.mjs --real-ai`, set EMBED_PROXY to the local
# scripts/dev-ai-proxy.mjs, which calls the Workers AI REST API exactly as the binding would
# (pooling "cls", see src/lib/embed.js).

[[durable_objects.bindings]]
name = "CONFERENCE"
class_name = "ConferenceDO"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConferenceDO", "DirectoryDO"]

[triggers]
crons = ["*/10 * * * *"]

[vars]
# ADMIN_TEST_ROUTES is deliberately not set here: the smoke's /admin/test/* fixtures answer 404 on a
# deployed Worker unless this variable is the string "1" (src/index.js, handleAdmin).
# worker/scripts/dev-vars.mjs sets it for a local run (.dev.vars).
# Extra origins allowed to call the API cross-origin, for local development only (the Vite dev
# server and preview). The app itself is served by this Worker, so its own origin is always
# allowed (src/index.js); native apps send no Origin header and get no CORS headers.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173"
EMBED_MODEL = "@cf/baai/bge-small-en-v1.5"
# VAPID_SUBJECT is the contact the push services receive with every Web Push request (the "sub" claim
# of the VAPID token, RFC 8292): an https: URL or a mailto: address of whoever operates this
# deployment. A value to edit: this one is the original repository's page, so a fork or a copy sets its
# own before deploying. Web Push is off while it is empty or removed.
VAPID_SUBJECT = "https://github.com/KurtLehnardt/conferenceCaddie"
DAILY_REQUEST_BUDGET = "70000"
ROWS_READ_SOFT_CAP = "3500000"
ROWS_WRITTEN_SOFT_CAP = "85000"

[observability]
enabled = true

# Invocation logs record the request and its metadata, which can include the X-Caddie-Device
# header (a device secret). Only the Worker's own one-line console logs are kept.
[observability.logs]
invocation_logs = false
