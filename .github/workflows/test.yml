# Runs the server and Worker tests (`npm test` runs test/*.test.mjs and worker/test/*.test.mjs) and the web app's tests (`npm --prefix web test`, when the web
# package has a test script) on Node 22, the oldest version package.json's engines field allows,
# and on the latest Node. The server tests stub Elasticsearch in memory; nothing needs a secret or
# any network beyond installing the dependencies. The Worker's tests use node:sqlite, which needs
# Node 22.13 or later without a flag; setup-node's "22" is the latest 22.x.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', 'latest']
    steps:
      # Actions are pinned by commit, with the release they belong to in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Server tests
        run: |
          npm ci
          npm test

      # The web app's own tests (PR #14 adds `npm --prefix web test`, node:test without a bundler).
      # --if-present keeps this step green on a tree whose web package has no test script yet.
      - name: Web tests
        run: |
          npm --prefix web ci
          npm --prefix web test --if-present
