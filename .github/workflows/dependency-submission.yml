# Sends the native Gradle dependency graph to GitHub so Dependabot alerts and security updates cover
# native/'s dependencies, which GitHub cannot read from the version catalog alone.
# Every action is pinned to a full commit SHA; Dependabot (.github/dependabot.yml) proposes updates.
name: Gradle dependency graph

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    name: Submit the Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: native
