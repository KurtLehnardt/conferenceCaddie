# Builds the native apps in native/ (a Kotlin Multiplatform core with a Compose Multiplatform UI) for
# Android and iOS. Every run tests the shared code and builds both apps without release signing.
#
# Signing happens only for main (a push to main, or a manual run on main), in jobs that use the
# `release` environment, whose secrets are available to main only. Gradle never runs in a job that
# has a secret. The Android signing job never checks out or runs project code: Gradle builds an
# unsigned APK in the build job, which has no secrets, and the signing job only signs that file with
# the runner's own Android build tools. The iOS release is split the same way: one job without
# secrets builds the Kotlin framework with Gradle, one signs the app with the distribution
# certificate and runs no Gradle, and one uploads the signed file with the API key and checks out
# nothing. Each signed step is skipped with a notice when its secrets are missing.
#
# Every action is pinned to a full commit SHA; Dependabot (.github/dependabot.yml) proposes updates.
name: Native apps

on:
  pull_request:
    paths:
      - 'native/**'
      # The shared tests compile the contract fixtures and follow the contract schemas.
      - 'contracts/**'
      # The talk checks build bundles from the committed data with the bundle builder and its tools,
      # and checkEmbeddingRevision reads the model revision from scripts/lib/embedder.mjs.
      - 'scripts/lib/embedder.mjs'
      - 'scripts/build-bundles.mjs'
      - 'scripts/smoke.mjs'
      - 'data/**'
      - 'tools/bundles/**'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      # The shared tests compile the contract fixtures and follow the contract schemas.
      - 'contracts/**'
      # The talk checks build bundles from the committed data with the bundle builder and its tools,
      # and checkEmbeddingRevision reads the model revision from scripts/lib/embedder.mjs.
      - 'scripts/lib/embedder.mjs'
      - 'scripts/build-bundles.mjs'
      - 'scripts/smoke.mjs'
      - 'data/**'
      - 'tools/bundles/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main always finish, because they publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: native

jobs:
  android:
    name: Shared tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_apk: ${{ steps.release_apk.outputs.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Every build gets versionCode 1000 + the run number, which stays above the Capacitor app's.
      # A re-run of the same run reuses its number; start a new run instead to publish a new build.
      - name: Set the version code
        run: echo "CADDIE_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # The pinned downloads of gradle/pinned-downloads.properties (the query embedding model, its
      # vocabulary and ONNX Runtime for iOS), kept by SHA-256 in Gradle's user home. Pull requests
      # only read the cache; on main the first Linux job and the simulator job write it.
      - name: Restore the pinned downloads
        id: pinned
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/caddie-pinned
          key: caddie-pinned-${{ runner.os }}-${{ hashFiles('native/gradle/pinned-downloads.properties') }}

      # openEncoder must stay the only way into ONNX Runtime (shared, embed/BgeEmbedder.kt).
      - name: Check that only openEncoder uses ONNX Runtime
        run: bash scripts/check-onnxruntime-entry.sh

      # Material3 is not bumped by Dependabot; it must stay the pair of Compose Multiplatform.
      - name: Check the Compose Multiplatform and Material3 pairing
        run: bash scripts/check-compose-pairing.sh

      # On Linux the iOS targets are skipped, so allTests runs the shared tests on the JVM, the
      # embedding tests with the real model among them, and the checks of the pinned downloads.
      # Every assemble also checks the merged manifest for ONNX Runtime's telemetry provider.
      - name: Shared tests and debug APK
        run: ./gradlew :shared:allTests :androidApp:assembleDebug

      # The build tools' floors (native/build.gradle.kts) must still reach Android Lint, the Unified
      # Test Platform and Swift export. Fails when one of those configurations is missing (a plugin
      # renamed it) or resolves a floored module below its floor; resolving their files also runs
      # dependency verification on them.
      - name: Check the build tools' floors
        run: ./gradlew checkToolingFloors

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-android-test-reports
          path: |
            native/shared/build/reports/tests/
            native/shared/build/test-results/**/*.xml
          retention-days: 7

      - name: Name the debug APK after the commit
        id: debug_apk
        run: |
          out="conference-caddie-native-$(git rev-parse --short HEAD)-debug.apk"
          cp androidApp/build/outputs/apk/debug/androidApp-arm64-v8a-debug.apk "$GITHUB_WORKSPACE/$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.debug_apk.outputs.file }}
          path: ${{ steps.debug_apk.outputs.file }}
          retention-days: 14

      # The release APK is built on every run, pull requests included, without any key (R8 and
      # resource shrinking on, unsigned), so a change that breaks the release build fails here.
      - name: Unsigned release APK
        run: ./gradlew -Pcaddie.unsignedRelease=true :androidApp:assembleRelease

      # A WebView calls the methods marked @JavascriptInterface by name (CapacitorMigration), so the
      # R8 build must keep their names; the instrumented tests run the debug build, which R8 leaves alone.
      - name: Check that R8 kept the JavaScript interface
        run: bash scripts/check-javascript-interface.sh

      # One APK per ABI (androidApp/build.gradle.kts): arm64-v8a is the one that is published.
      - name: Report the release APK sizes
        run: |
          {
            echo "| Release APK (unsigned) | Bytes |"
            echo "| --- | ---: |"
            for f in androidApp/build/outputs/apk/release/*.apk; do
              echo "| $(basename "$f") | $(wc -c < "$f" | tr -d ' ') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the pinned downloads
        if: github.ref == 'refs/heads/main' && steps.pinned.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/caddie-pinned
          key: ${{ steps.pinned.outputs.cache-primary-key }}

      # Only main hands the unsigned APK to the sign job: the arm64-v8a APK, the one published on
      # GitHub Releases. The x86_64 APK is for emulators and is not signed with the release key.
      - name: Name the release APK after the commit
        id: release_apk
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          out="conference-caddie-native-$(git rev-parse --short HEAD)-release.apk"
          cp androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release-unsigned.apk "$GITHUB_WORKSPACE/unsigned-$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Keep the unsigned release APK for the sign job
        if: steps.release_apk.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ steps.release_apk.outputs.file }}
          path: unsigned-${{ steps.release_apk.outputs.file }}
          retention-days: 1

  # Signs the release APK with the project's release key. This job has the key, so it runs no
  # project code: no checkout, no Gradle, no npm. It uses the runner image's Android build tools.
  android-sign:
    name: Sign the release APK
    # The UI tests and the release smoke test on the emulator must pass before anything is signed.
    needs: [android, android-device-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.android.outputs.release_apk != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    defaults:
      run:
        working-directory: .
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      APK: ${{ needs.android.outputs.release_apk }}
    steps:
      # The file name comes from the build job's output. It is used in paths and artifact names,
      # so it must be the expected name for this commit and nothing else.
      - name: Check the APK name
        run: |
          if [[ ! "$APK" =~ ^conference-caddie-native-([0-9a-f]{7,40})-release\.apk$ ]] || [[ "$GITHUB_SHA" != "${BASH_REMATCH[1]}"* ]]; then
            echo "::error title=Unexpected APK name::The build job named the APK '$APK', which is not the release APK of this commit."
            exit 1
          fi

      - name: Note that release signing is skipped
        if: env.HAS_ANDROID_SIGNING != 'true'
        run: echo "::notice title=Release APK skipped::The ANDROID_KEYSTORE_* secrets are not set in the release environment, so the release APK was not signed."

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_ANDROID_SIGNING == 'true'
        with:
          name: unsigned-${{ env.APK }}

      # The published APK is the arm64-v8a one (androidApp/build.gradle.kts): its native libraries
      # must all be under lib/arm64-v8a/. This only lists the archive's entries.
      - name: Check the APK's ABI
        if: env.HAS_ANDROID_SIGNING == 'true'
        run: |
          set -euo pipefail
          abis=$(unzip -Z1 "unsigned-$APK" | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u)
          if [ "$abis" != "arm64-v8a" ]; then
            echo "::error title=Wrong ABI::The release APK has native libraries for '$(printf '%s' "$abis" | tr '\n' ' ')', not only arm64-v8a."
            exit 1
          fi

      - name: Sign and check the certificate
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
          unset ANDROID_KEYSTORE_BASE64

          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$tools/zipalign" -f -p 4 "unsigned-$APK" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK" "$RUNNER_TEMP/aligned.apk"
          rm -f "$ks"

          "$tools/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          # apksigner labels signers differently across versions ("Signer #1 ..." in
          # 36, "V3.0 Signer: ..." in 37), so match any certificate SHA-256 line and
          # require that they all agree on one digest.
          actual=$(sed -n 's/^.*certificate SHA-256 digest: *//p' "$RUNNER_TEMP/certs.txt" | tr -d ': \r' | tr 'A-F' 'a-f' | sort -u)
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$expected" ] || [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error title=Wrong signing key::The APK's certificate SHA-256 is '$(printf '%s' "$actual" | tr '\n' ' ')', not the ANDROID_RELEASE_CERT_SHA256 variable."
            exit 1
          fi
          echo "Release APK signed by certificate SHA-256 $actual" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_ANDROID_SIGNING == 'true'
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          retention-days: 30

  # The Compose UI tests (composeApp/src/commonTest, run as Android device tests), the
  # instrumented smoke test of the app (androidApp/src/androidTest) and a smoke test of the R8
  # release build (scripts/release-smoke.sh) on an Android emulator. No secrets; pull requests and
  # main. The release build here is signed with the runner's debug key, so the emulator accepts it.
  android-device-tests:
    name: UI tests on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # The emulator needs hardware acceleration, which the runner allows once /dev/kvm is open.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The pinned downloads of gradle/pinned-downloads.properties (the query embedding model, its
      # vocabulary and ONNX Runtime for iOS), kept by SHA-256 in Gradle's user home. Pull requests
      # only read the cache; on main the first Linux job and the simulator job write it.
      - name: Restore the pinned downloads
        id: pinned
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/caddie-pinned
          key: caddie-pinned-${{ runner.os }}-${{ hashFiles('native/gradle/pinned-downloads.properties') }}

      # Builds the test APKs and the release APK before the emulator starts, so its boot time is not
      # spent on Gradle.
      - name: Build the test APKs and the release APK
        run: ./gradlew :composeApp:assembleAndroidDeviceTest :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :androidApp:assembleRelease

      # The emulator's booted state is cached as a snapshot, so most runs skip the cold boot. The
      # cache is keyed on the emulator settings and the month: the emulator and its system image
      # update without notice, and a snapshot they no longer accept is then rebuilt within a month.
      # Pull requests only read the cache; main writes it.
      - name: Name the emulator snapshot
        id: avd_key
        working-directory: .
        run: echo "key=avd-${RUNNER_OS}-api34-x86_64-default-v1-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the emulator snapshot
        id: avd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd_key.outputs.key }}

      - name: Create the emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: native
          script: echo "The emulator snapshot is ready."

      - name: Save the emulator snapshot
        if: github.ref == 'refs/heads/main' && steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd.outputs.cache-primary-key }}

      - name: Run the UI tests and the release smoke test on an emulator
        # The release smoke test probes the server and bundles the app is built to use; they have no
        # default in the script. A fork sets the repository variables CADDIE_BACKEND and
        # CADDIE_BUNDLE_BASE; the fallbacks are the official values the app itself ships with
        # (native/shared/.../core/CaddieCore.kt).
        env:
          CADDIE_BACKEND: ${{ vars.CADDIE_BACKEND || 'https://conference-caddie-265846417372.us-west1.run.app' }}
          CADDIE_BUNDLE_BASE: ${{ vars.CADDIE_BUNDLE_BASE || 'https://kurtlehnardt.github.io/conferenceCaddie/bundles/' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: native
          script: |
            ./gradlew :composeApp:connectedAndroidDeviceTest :androidApp:connectedDebugAndroidTest
            bash scripts/release-smoke.sh

      # EmbeddingDeviceTest measures the shipped model on the emulator; its numbers go to the summary.
      - name: Report the on-device embedding numbers
        if: always()
        run: |
          grep -rhoE "EMBEDDING-REPORT[^<\"]*" composeApp/build/outputs/androidTest-results/ composeApp/build/test-results/ 2>/dev/null | sort -u >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-android-device-test-reports
          path: |
            native/composeApp/build/reports/androidTests/
            native/androidApp/build/reports/androidTests/
          retention-days: 7

  ios:
    name: iOS simulator build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Kotlin/Native and its toolchain (about 2 GB) are keyed on the version catalog and, here, the
      # partial-linkage level, so an old Kotlin version is never restored. Pull requests only read the
      # cache; main writes it. ~/.konan also holds the per-library caches that the debug links reuse.
      # Their own key leaves out the partial-linkage level, and a cache built at the default level lets a
      # missing symbol through, so "pl-error" names the level the caches were built at
      # (-Xpartial-linkage-loglevel=ERROR, shared/build.gradle.kts). Change it with the level.
      - name: Restore Kotlin/Native
        id: konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-pl-error-${{ hashFiles('native/gradle/libs.versions.toml') }}

      - name: Show the Xcode version
        run: xcodebuild -version

      # The pinned downloads of gradle/pinned-downloads.properties (the query embedding model, its
      # vocabulary and ONNX Runtime for iOS), kept by SHA-256 in Gradle's user home. Pull requests
      # only read the cache; on main the first Linux job and the simulator job write it.
      - name: Restore the pinned downloads
        id: pinned
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/caddie-pinned
          key: caddie-pinned-${{ runner.os }}-${{ hashFiles('native/gradle/pinned-downloads.properties') }}

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      # The Compose UI tests of composeApp/src/commonTest, on the iOS simulator.
      - name: UI tests on the iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ios-test-reports
          path: |
            native/shared/build/test-results/
            native/shared/build/reports/tests/
            native/composeApp/build/test-results/
            native/composeApp/build/reports/tests/
          retention-days: 7

      # The licences shown in Settings must list every library both apps ship. The check needs the
      # iOS dependency graph, so it runs here on macOS; it fails on a new dependency until its
      # licence is in the script's table and the notices are regenerated.
      - name: Check the third-party notices
        run: python3 scripts/third-party-notices.py --check

      - name: Build the app for the simulator without signing
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Save the pinned downloads
        if: github.ref == 'refs/heads/main' && steps.pinned.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/caddie-pinned
          key: ${{ steps.pinned.outputs.cache-primary-key }}

      - name: Save Kotlin/Native
        if: github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

  # The device framework in Release, as an archive would build it. It is a compile check that takes
  # 30 to 45 minutes on a contended runner, so it runs here in parallel with "iOS simulator build"
  # instead of inside it, where it pushed that job past its 60-minute limit. It reads the Gradle and
  # pinned-download caches without writing them; on main it saves Kotlin/Native under its own key.
  ios-device-link:
    name: iOS device Release link
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Restore Kotlin/Native
        id: konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-device-${{ hashFiles('native/gradle/libs.versions.toml') }}

      - name: Show the Xcode version
        run: xcodebuild -version

      - name: Restore the pinned downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/caddie-pinned
          key: caddie-pinned-${{ runner.os }}-${{ hashFiles('native/gradle/pinned-downloads.properties') }}

      - name: Link the Release framework for devices
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

      - name: Save Kotlin/Native
        if: github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

  # The talk checks of scripts/smoke.mjs against the on-device search (TalkSmokeTest), the exit
  # criterion of phase 2 in docs/NATIVE_PLAN.md: bundles are built from the committed data with
  # scripts/build-bundles.mjs, as the Pages workflow builds them, and searched on the JVM with the
  # shipped query model. No secrets; pull requests and main.
  talk-smoke:
    name: Talk checks against the on-device search
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # The pinned downloads of gradle/pinned-downloads.properties (the query embedding model, its
      # vocabulary and ONNX Runtime for iOS), kept by SHA-256 in Gradle's user home. Pull requests
      # only read the cache; on main the first Linux job and the simulator job write it.
      - name: Restore the pinned downloads
        id: pinned
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/caddie-pinned
          key: caddie-pinned-${{ runner.os }}-${{ hashFiles('native/gradle/pinned-downloads.properties') }}

      # The embedding library, with no install script (docs/BUNDLES.md, Why --ignore-scripts).
      - name: Install the bundle tools
        working-directory: .
        run: npm --prefix tools/bundles ci --ignore-scripts

      - name: Read the pinned model revision
        id: model
        working-directory: .
        run: |
          rev=$(grep -oE "ONNX_REVISION = '[0-9a-f]+'" scripts/lib/embedder.mjs | grep -oE "[0-9a-f]{40}")
          if [ -z "$rev" ]; then echo "::error::ONNX_REVISION not found in scripts/lib/embedder.mjs"; exit 1; fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      # The fp32 model the bundle builder embeds talks with (SHA-256 pinned, fails closed).
      - name: Restore the bundle model
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/model
          key: bundle-model-${{ steps.model.outputs.revision }}

      # Every vector is computed from the committed data (--reuse-from none), so nothing published
      # is trusted. The bundle base is only written into capabilities.json, which is not read here.
      - name: Build the talk bundles
        working-directory: .
        env:
          MODEL_FLAG: ${{ steps.model-cache.outputs.cache-hit == 'true' && '--no-model-download' || '' }}
        run: |
          node scripts/build-bundles.mjs --out "$RUNNER_TEMP/site" --base-url https://127.0.0.1:8701/bundles/ \
            --reuse-from none $MODEL_FLAG --takedown https://github.com/KurtLehnardt/conferenceCaddie/issues \
            --publisher-name "Conference Caddie"

      - name: Run the talk checks
        run: ./gradlew :shared:smokeTalks "-Pcaddie.smokeSite=$RUNNER_TEMP/site"

      - name: Report the talk checks
        if: always()
        run: |
          if [ -f shared/build/reports/smoke-talks.txt ]; then
            { echo '```'; cat shared/build/reports/smoke-talks.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the bundle model
        if: github.ref == 'refs/heads/main' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/model
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

  testflight-gate:
    name: Check for TestFlight secrets
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        working-directory: .
        env:
          HAS_ALL: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' && secrets.APPLE_TEAM_ID != '' && secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_PASSWORD != '' && secrets.IOS_APPSTORE_PROFILE_BASE64 != '' }}
        run: |
          if [ "$HAS_ALL" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=TestFlight skipped::Set the seven TestFlight secrets in the release environment (see native/README.md) to upload builds."
          fi

  # The TestFlight release is three jobs, so that Gradle never runs in a job with a secret and
  # no secret is on a runner longer than it is needed:
  #
  #   ios-release-build  Gradle and the Kotlin/Native toolchain, no secrets. Builds the Release
  #                      device framework and the Compose resources and keeps them for one day.
  #   ios-sign           The distribution certificate and profile, no Gradle. Archives the app
  #                      with that framework and exports a signed IPA, kept for one day.
  #   testflight-upload  The App Store Connect API key, no checkout. Uploads the IPA.
  #
  # Not yet run: see native/README.md.
  ios-release-build:
    name: iOS Release framework
    needs: [ios, ios-device-link, testflight-gate]
    if: needs.testflight-gate.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Restore Kotlin/Native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-device-${{ hashFiles('native/gradle/libs.versions.toml') }}

      # The pinned downloads of gradle/pinned-downloads.properties (the query embedding model, its
      # vocabulary and ONNX Runtime for iOS), kept by SHA-256 in Gradle's user home. Pull requests
      # only read the cache; on main the first Linux job and the simulator job write it.
      - name: Restore the pinned downloads
        id: pinned-release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/caddie-pinned
          key: caddie-pinned-${{ runner.os }}-${{ hashFiles('native/gradle/pinned-downloads.properties') }}

      # An unsigned archive runs the "Compile Kotlin Framework" build phase, and so
      # `embedAndSignAppleFrameworkForXcode`, with exactly the Xcode settings the signed archive
      # has. That task copies the device framework to composeApp/build/xcode-frameworks/ and
      # the Compose resources into the app's compose-resources folder.
      - name: Build the Release framework and Compose resources
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/unsigned.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive

      - name: Pack the framework and the resources
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ios-kotlin"
          mkdir -p "$out"
          shopt -s nullglob
          frameworks=(composeApp/build/xcode-frameworks/Release/iphoneos*/ComposeApp.framework)
          apps=("$RUNNER_TEMP/unsigned.xcarchive/Products/Applications/"*.app)
          if [ "${#frameworks[@]}" -ne 1 ] || [ "${#apps[@]}" -ne 1 ]; then
            echo "::error title=Unexpected build output::Expected one Release device framework and one app in the archive."
            exit 1
          fi
          ditto "${frameworks[0]}" "$out/ComposeApp.framework"
          if [ -d "${apps[0]}/compose-resources" ]; then
            ditto "${apps[0]}/compose-resources" "$out/compose-resources"
          else
            mkdir "$out/compose-resources"
          fi
          xcodebuild -version > "$out/xcode-version.txt"
          tar -C "$out" -cf "$RUNNER_TEMP/ios-kotlin.tar" .

      # The size of the Release app before signing: the .app as installed, and zipped as an IPA
      # packs it. The App Store's per-device sizes need a signed export (ios-sign reports the IPA).
      - name: Report the app size
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=("$RUNNER_TEMP/unsigned.xcarchive/Products/Applications/"*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::warning title=No app size::Expected one app in the archive; the size is not reported."
            exit 0
          fi
          app="${apps[0]}"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app-size.zip"
          {
            echo "| iOS Release app (unsigned) | Bytes |"
            echo "| --- | ---: |"
            echo "| $(basename "$app") installed | $(( $(du -sk "$app" | cut -f1) * 1024 )) |"
            echo "| zipped, as in an IPA | $(wc -c < "$RUNNER_TEMP/app-size.zip" | tr -d ' ') |"
            exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
            echo "| executable (Kotlin, Compose and ONNX Runtime, linked statically) | $(wc -c < "$app/$exe" | tr -d ' ') |"
            res=0
            if [ -d "$app/compose-resources" ]; then res=$(( $(du -sk "$app/compose-resources" | cut -f1) * 1024 )); fi
            echo "| compose-resources (the query model among them) | $res |"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/app-size.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-kotlin-release
          path: ${{ runner.temp }}/ios-kotlin.tar
          retention-days: 1

      - name: Stop the Gradle daemon
        if: always()
        run: ./gradlew --stop

  ios-sign:
    name: Sign the iOS build
    needs: [ios-release-build, testflight-gate]
    if: needs.testflight-gate.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    steps:
      # The checkout is for the Xcode project and the Swift sources. No Java, Gradle or
      # Kotlin/Native is set up here, and the Gradle wrapper is removed before anything builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-kotlin-release
          path: ${{ runner.temp }}/ios-kotlin-download

      # The framework must come from the same Xcode as this job uses.
      - name: Unpack the framework and remove the Gradle wrapper
        run: |
          set -euo pipefail
          rm -f gradlew gradlew.bat
          mkdir -p "$RUNNER_TEMP/ios-kotlin"
          tar -xf "$RUNNER_TEMP/ios-kotlin-download/ios-kotlin.tar" -C "$RUNNER_TEMP/ios-kotlin"
          test -f "$RUNNER_TEMP/ios-kotlin/ComposeApp.framework/ComposeApp"
          if ! xcodebuild -version | cmp -s - "$RUNNER_TEMP/ios-kotlin/xcode-version.txt"; then
            echo "::error title=Different Xcode::The framework was built with another Xcode version than this job has. Start a new run."
            exit 1
          fi

      # The build number is 1000 + the run number. App Store Connect refuses a build number it has
      # seen, so a re-run of the same run fails at upload; start a new run instead.
      - name: Set the build number
        run: echo "CADDIE_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # The key may be used by /usr/bin/codesign only: -T trusts that one tool, and the partition
      # list holds only "apple:", the partition codesign needs (see `man security`).
      - name: Install the distribution certificate and profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"

          # Release builds are signed with the aps-environment (push) entitlement, so a profile
          # without it makes the archive fail much later with a signing error that does not say why.
          # Only pass or fail is printed, never the profile.
          if ! security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" > "$RUNNER_TEMP/appstore-profile.plist" 2> /dev/null \
            || ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/appstore-profile.plist" > /dev/null 2>&1; then
            rm -f "$RUNNER_TEMP/appstore.mobileprovision" "$RUNNER_TEMP/appstore-profile.plist"
            echo "::error title=Profile has no push entitlement::The App Store provisioning profile in IOS_APPSTORE_PROFILE_BASE64 is unreadable or has no aps-environment entitlement. Maintainer: enable Push Notifications on the app.conferencecaddie App ID in the Apple Developer portal, regenerate the App Store provisioning profile, and update the IOS_APPSTORE_PROFILE_BASE64 secret."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/appstore-profile.plist"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(printf '%s' "$line" | tr -d '" ')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/dist.p12"

          uuid=$(security cms -D -i "$RUNNER_TEMP/appstore.mobileprovision" | plutil -extract UUID raw -o - -)
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/appstore.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          rm -f "$RUNNER_TEMP/appstore.mobileprovision"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      # OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES makes the "Compile Kotlin Framework" build phase
      # skip Gradle; it copies CADDIE_PREBUILT_COMPOSE_RESOURCES into the app instead, and the app
      # links the prebuilt framework through FRAMEWORK_SEARCH_PATHS.
      - name: Archive the Release build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/ConferenceCaddie.xcarchive"
          OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES
          FRAMEWORK_SEARCH_PATHS="$RUNNER_TEMP/ios-kotlin"
          CADDIE_PREBUILT_COMPOSE_RESOURCES="$RUNNER_TEMP/ios-kotlin/compose-resources"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
          CURRENT_PROJECT_VERSION="$CADDIE_BUILD_NUMBER"
          archive

      # Export only: iosApp/ExportOptions.plist has the destination "export", so nothing is
      # uploaded from this job and it needs no App Store Connect key.
      - name: Export the signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp iosApp/ExportOptions.plist "$options"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:app.conferencecaddie string $PROFILE_UUID" "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ConferenceCaddie.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export"
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/export/"*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "::error title=No IPA::The export did not produce exactly one IPA."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa"
          mv "${ipas[0]}" "$RUNNER_TEMP/ipa/ConferenceCaddie-$CADDIE_BUILD_NUMBER.ipa"
          echo "Signed IPA: $(wc -c < "$RUNNER_TEMP/ipa/ConferenceCaddie-$CADDIE_BUILD_NUMBER.ipa" | tr -d ' ') bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keychain and profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/appstore.mobileprovision"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-signed-ipa
          path: ${{ runner.temp }}/ipa/
          retention-days: 1

  # Uploads the signed IPA with altool, authenticated by the App Store Connect API key. The build
  # then appears in TestFlight once Apple has processed it. No checkout: this job runs no project
  # code, only the runner's Xcode.
  testflight-upload:
    name: Upload to TestFlight
    needs: ios-sign
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-signed-ipa
          path: ${{ runner.temp }}/ipa

      # `altool --upload-package <ipa> --api-key --api-issuer` is the upload altool's own help
      # documents (Xcode 26 and 27); altool reads the key from $API_PRIVATE_KEYS_DIR/AuthKey_<id>.p8.
      # The key is written just before the upload, readable by this user only, and deleted
      # straight after it.
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error title=Bad ASC_KEY_ID::ASC_KEY_ID must be the key id, letters and digits only."
            exit 1
          fi
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/ipa/"*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "::error title=No IPA::Expected exactly one IPA from the sign job."
            exit 1
          fi
          keys="$RUNNER_TEMP/private_keys"
          trap 'rm -rf "$keys"' EXIT
          mkdir -p "$keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$keys/AuthKey_$ASC_KEY_ID.p8"
          unset ASC_KEY_P8_BASE64
          API_PRIVATE_KEYS_DIR="$keys" xcrun altool --upload-package "${ipas[0]}" \
            --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID"
          echo "Uploaded $(basename "${ipas[0]}") to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
