# Builds the native apps in native/ (a Kotlin Multiplatform core with a Compose Multiplatform UI) for
# Android and iOS. Every run tests the shared code and builds both apps without release signing.
# Pushes to main (and manual runs) also build a release APK signed with the project's release key,
# and upload an iOS build to TestFlight once the App Store Connect secrets exist. Each signed step
# is skipped with a notice when its secrets are missing, so forks and fresh clones still go green.
name: Native apps

on:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main always finish, because they publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: native

jobs:
  android:
    name: Shared tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secrets cannot be read in an `if:`, so expose only whether all four are present.
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # On Linux the iOS targets are skipped, so allTests runs the shared tests as Android host tests.
      - name: Shared tests and debug APK
        run: ./gradlew :shared:allTests :androidApp:assembleDebug

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-android-test-reports
          path: native/shared/build/reports/tests/
          retention-days: 7

      - name: Name the debug APK after the commit
        id: debug_apk
        run: |
          out="conference-caddie-native-$(git rev-parse --short HEAD)-debug.apk"
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk "$GITHUB_WORKSPACE/$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.debug_apk.outputs.file }}
          path: ${{ steps.debug_apk.outputs.file }}
          retention-days: 14

      - name: Note that release signing is skipped
        if: github.event_name != 'pull_request' && env.HAS_ANDROID_SIGNING != 'true'
        run: echo "::notice title=Release APK skipped::The ANDROID_KEYSTORE_* secrets are not set, so no signed release APK was built."

      # The keystore is written to the runner's temp directory and removed when the step ends. The
      # configuration cache is off for this build so the passwords are never stored in it.
      - name: Signed release APK
        id: release_apk
        if: github.event_name != 'pull_request' && env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-configuration-cache :androidApp:assembleRelease

          out="conference-caddie-native-$(git rev-parse --short HEAD)-release.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$GITHUB_WORKSPACE/$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

          # The certificate fingerprint is public; printing it shows which key signed the build.
          fingerprint=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$GITHUB_WORKSPACE/$out" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          echo "Release APK signed by certificate SHA-256 $fingerprint" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: steps.release_apk.outcome == 'success'
        with:
          name: ${{ steps.release_apk.outputs.file }}
          path: ${{ steps.release_apk.outputs.file }}
          retention-days: 30

  ios:
    name: iOS simulator build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Show the Xcode version
        run: xcodebuild -version

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Build the app for the simulator without signing
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  testflight-gate:
    name: Check for App Store Connect secrets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        working-directory: .
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=TestFlight skipped::Set ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 and APPLE_TEAM_ID to upload builds to TestFlight."
          fi

  # Archives a Release build, signs it with automatic signing through the App Store Connect API key,
  # and uploads it to App Store Connect with `xcodebuild -exportArchive` (ExportOptions.plist has
  # destination "upload"). The build then appears in TestFlight after Apple finishes processing it.
  testflight:
    name: TestFlight upload
    needs: [ios, testflight-gate]
    if: needs.testflight-gate.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive the Release build
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/ConferenceCaddie.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGN_STYLE=Automatic
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          archive

      - name: Export and upload to App Store Connect
        run: |
          cp iosApp/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ConferenceCaddie.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
