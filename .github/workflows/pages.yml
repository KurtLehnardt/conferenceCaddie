name: Deploy web app to GitHub Pages

# Builds the web app for https://kurtlehnardt.github.io/conferenceCaddie/ and publishes it with the
# official Pages actions. The app calls the Cloudflare Worker API cross-origin; its address is the
# repository variable CADDIE_API_BASE (Settings, Secrets and variables, Actions, Variables). The
# variable holds a public address, not a secret. The job fails when it is empty, because a build
# without an API address would call the wrong host.
#
# Pages must be enabled once with the source set to "GitHub Actions" (Settings, Pages).

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CADDIE_API_BASE: ${{ vars.CADDIE_API_BASE }}
    steps:
      - name: Check the API address is set
        run: |
          if [ -z "$CADDIE_API_BASE" ]; then
            echo "The repository variable CADDIE_API_BASE is empty. Set it to the Worker's https address." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          VITE_BASE: /conferenceCaddie/
          VITE_API_BASE: ${{ vars.CADDIE_API_BASE }}
          VITE_CLIENT_EXTRACT: '1'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
