name: Deploy the talk bundles to GitHub Pages

# Builds the GitHub Pages site of the repository it runs in, https://<owner>.github.io/<repository>/
# (for KurtLehnardt/conferenceCaddie, https://kurtlehnardt.github.io/conferenceCaddie/; the first step
# of the build job works the addresses out, and repository variables can override them), and
# publishes it with the official Pages actions. The site holds only public talk data, never the web
# app:
# - the talk bundles of tier 1 (docs/BUNDLES.md, docs/contracts/talk-bundle.md): bundles/<slug>/<hash16>/
#   {bundle.json, vectors.i8}, bundles/conferences.json (with a copy at conferences.json), the
#   builder's bundles/build-info.json and bundles/sources.json, and the tier 1 capabilities.json,
#   built by scripts/build-bundles.mjs;
# - a small landing page (index.html, and the same page as 404.html, from scripts/pages-landing.mjs)
#   with no script and no storage access, which links to the app.
#
# The web app is served by the Cloudflare Worker on its own origin (worker/scripts/deploy.sh). The
# github.io origin is shared with the account's other Pages sites, which could read the app's device
# secrets from localStorage there, so the app is never published here (DECISIONS.md, 2026-11-10).
#
# Two kinds of run publish the site, and both go through this workflow:
# - Ingest runs. ingest.yml calls this workflow (workflow_call) after it has pushed fresh schedules to
#   the Worker, with the name of an artifact that holds the conference files it pushed
#   (scripts/stage-ingest-data.mjs). A called run checks out the current main, not the ingest's
#   commit (which can be up to 90 minutes old), so a takedown merged in the meantime is applied and
#   an older commit never deploys after a newer one. The staged files are laid over data/ before the
#   build, and those conferences are always rebuilt from them (--fresh), so the bundles carry the
#   schedule the Worker serves. The ingest run is the publisher of fresh schedules; nothing is
#   committed to the repository.
# - Runs of its own (a push to main, the weekly schedule, a manual run), built from the committed
#   data/, which is only a seed.
# Every build passes --live with the live bundle base: a conference whose live bundle came from a
# schedule fetched later than data/ holds (bundles/sources.json) is kept as it is instead of being
# rebuilt from older data, so a run from the committed data never replaces what an ingest published
# (scripts/lib/bundle-sources.mjs). A run that cannot read the live site fails rather than guess.
# The concurrency group below is the workflow's own, also when ingest.yml calls it, so two deploys
# never overlap. The Pages CDN keeps the previous deploy's files for up to ten minutes, so the build
# first looks up when the latest successful Pages deployment was created (Deployments API) and waits
# until the live files carry a Last-Modified at least that new (build-bundles.mjs --live-since).
# Nothing here needs the Worker: the talk bundles are available to the native apps whether or not
# the Worker has been deployed.
# Repository variables (Settings, Secrets and variables, Actions, Variables), public addresses and
# not secrets:
#   CADDIE_APP_URL   the app's address, the Worker's https address. The landing page links to it, or
#                    says the app is not live yet while it is empty.
# Optional overrides of the addresses the build publishes under (the first step of the build job
# works them out from the repository this runs in, so a fork needs none of them):
#   CADDIE_SITE_URL      the Pages site, https, ending in "/". Default: https://<owner, lowercased>.github.io/<repository>/
#                        (a user site, a repository named <owner>.github.io, lives at the root: set
#                        this to https://<owner>.github.io/).
#   CADDIE_BUNDLE_BASE   where the talk bundles are served, https, ending in "/". Default: the site address
#                        in effect plus bundles/.
#   CADDIE_TAKEDOWN_URL  where a takedown request goes, an https address or a mailto: address.
#                        Default: https://github.com/<owner>/<repository>/issues.
#
# Triggers: a push to main that changes the conference data or the bundle builder; a weekly
# scheduled full rebuild that recomputes every vector it builds (--reuse-from none), so nothing that
# was ever published persists unnoticed (docs/BUNDLES.md); a manual run; and the calls from
# ingest.yml and demo-conference.yml. In a called run github.event_name is the caller's, so the
# scheduled weekly ingest also re-embeds the conferences it refreshed from scratch; the demo
# conference's refresh (demo_refresh) keeps reusing the published vectors.
#
# The demo conference (config/demo-conference.json, off by default) is generated in every build:
# scripts/demo-conference.mjs prepare writes data/<its slug>/ for today when it is on (and removes the
# folder when it is off), and its slug is always passed in --fresh, so the live bundle follows the
# switch and the operator file whatever its sources.json record says. Its talks are invented and
# labelled; docs/ADMIN_CLI.md, "The demo conference".
#
# Pages must be enabled once with the source set to "GitHub Actions" (Settings, Pages).

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'contracts/**'
      - 'config/**'
      - 'scripts/build-bundles.mjs'
      - 'scripts/carry-forward-bundles.mjs'
      - 'scripts/pages-landing.mjs'
      - 'scripts/demo-conference.mjs'
      - 'scripts/ingest.mjs'
      - 'scripts/lib/**'
      - 'tools/bundles/**'
      - '.github/workflows/pages.yml'
  schedule:
    # Mondays, after the weekly ingest (ingest.yml, 09:17 UTC) has had time to push new data to the Worker.
    # The ingest publishes the bundles it refreshed itself, so this run keeps those (--live) and
    # re-embeds the others from the committed data.
    - cron: '47 11 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      ingest_artifact:
        description: 'The artifact of conference files an ingest run pushed to the Worker (scripts/stage-ingest-data.mjs).'
        type: string
        required: false
        default: ''
      demo_refresh:
        description: 'A refresh of the demo conference (demo-conference.yml): reuse the published vectors even when the caller runs on a schedule.'
        type: boolean
        required: false
        default: false

# The build job installs the third-party packages of tools/bundles (about seventy) with no install
# script, and nothing from the root package, which the bundle builder, the carry-forward script and the
# landing page script do not use. Even so, the build job holds no deploy credential: only the deploy
# job gets pages: write and the OIDC token, and it runs no repository code. The verify job checks the
# packed artifact itself, in a job with no permissions, before the deploy job may run.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# SITE_URL, BUNDLE_BASE and TAKEDOWN are not here: the build job works them out in its first step.
env:
  PUBLISHER: Conference Caddie

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: read
      pages: read
    env:
      CADDIE_APP_URL: ${{ vars.CADDIE_APP_URL }}
    steps:
      # A called run (from ingest.yml) builds from the current main; any other run from its own commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ingest_artifact && 'main' || '' }}
          persist-credentials: false

      # The addresses this build publishes under, for the steps below as SITE_URL, BUNDLE_BASE and
      # TAKEDOWN. They follow the repository the workflow runs in, so a fork or a renamed repository
      # needs no edit here: SITE_URL is https://<owner lowercased>.github.io/<repository>/, BUNDLE_BASE
      # that plus bundles/, TAKEDOWN https://github.com/<owner>/<repository>/issues. The repository
      # variables CADDIE_SITE_URL, CADDIE_BUNDLE_BASE and CADDIE_TAKEDOWN_URL override each one when set
      # (an unset or empty variable overrides nothing); BUNDLE_BASE is built from the SITE_URL in
      # effect. For KurtLehnardt/conferenceCaddie the result is https://kurtlehnardt.github.io/conferenceCaddie/,
      # https://kurtlehnardt.github.io/conferenceCaddie/bundles/ and
      # https://github.com/KurtLehnardt/conferenceCaddie/issues, exactly what this file held before.
      # Every expression goes through env, never into the script text. An address the scripts below
      # would refuse fails here, naming the variable; its value is not echoed.
      - name: Work out the site addresses
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SITE_URL_OVERRIDE: ${{ vars.CADDIE_SITE_URL }}
          BUNDLE_BASE_OVERRIDE: ${{ vars.CADDIE_BUNDLE_BASE }}
          TAKEDOWN_OVERRIDE: ${{ vars.CADDIE_TAKEDOWN_URL }}
        run: |
          set -euo pipefail
          name="${REPOSITORY#*/}"
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          site="${SITE_URL_OVERRIDE:-https://$owner.github.io/$name/}"
          case "$site" in */) ;; *) site="$site/" ;; esac
          bundles="${BUNDLE_BASE_OVERRIDE:-${site}bundles/}"
          case "$bundles" in */) ;; *) bundles="$bundles/" ;; esac
          takedown="${TAKEDOWN_OVERRIDE:-https://github.com/$REPOSITORY/issues}"
          https_dir='^https://[^[:space:][:cntrl:]?#]+/$'
          contact='^(https://|mailto:)[^[:space:][:cntrl:]]+$'
          [[ "$site" =~ $https_dir ]] || { echo "::error::SITE_URL (the repository variable CADDIE_SITE_URL, or the address derived from the repository) must be an https address that ends in /."; exit 1; }
          [[ "$bundles" =~ $https_dir ]] || { echo "::error::BUNDLE_BASE (the repository variable CADDIE_BUNDLE_BASE, or the site address plus bundles/) must be an https address that ends in /."; exit 1; }
          [[ "$takedown" =~ $contact ]] || { echo "::error::TAKEDOWN (the repository variable CADDIE_TAKEDOWN_URL, or the repository's issues address) must be an https or mailto: address."; exit 1; }
          {
            echo "SITE_URL=$site"
            echo "BUNDLE_BASE=$bundles"
            echo "TAKEDOWN=$takedown"
          } >> "$GITHUB_ENV"
          echo "Site $site, bundles $bundles, takedown $takedown"

      # When the latest successful Pages deployment was created. Pages sets Last-Modified to the time it
      # deployed a file, and the build waits until the live index is at least that new (--live-since).
      # This runs before any third-party package is installed.
      - name: Find the latest Pages deployment
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since=""
          ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=20" --jq '.[].id')
          for id in $ids; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = "success" ]; then
              since=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.created_at')
              break
            fi
          done
          if [ -z "$since" ]; then echo "::notice::No successful Pages deployment found; the live site is read without waiting for the CDN."; fi
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/bundles/package-lock.json

      - name: Start an empty dist-pages
        run: |
          rm -rf dist-pages
          mkdir -p dist-pages

      # Called from ingest.yml: the conference files that run pushed to the Worker replace the
      # committed ones. The artifact may hold only <slug>/conference.json and <slug>/talks.ndjson,
      # as plain files.
      - name: Download the ingest data
        if: inputs.ingest_artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.ingest_artifact }}
          path: ${{ runner.temp }}/ingest-data

      - name: Lay the ingest data over data/
        id: lay
        if: inputs.ingest_artifact
        run: |
          src="$RUNNER_TEMP/ingest-data"
          unexpected=$(find "$src" -mindepth 1 ! -type d ! -type f -print)
          if [ -n "$unexpected" ]; then echo "::error::The ingest data holds entries that are not plain files."; exit 1; fi
          unexpected=$(find "$src" -mindepth 1 -type f -print | sed "s|^$src/||" \
            | grep -vE '^[a-z0-9][a-z0-9-]{0,119}/(conference\.json|talks\.ndjson)$' || true)
          if [ -n "$unexpected" ]; then echo "::error::Unexpected files in the ingest data: $unexpected"; exit 1; fi
          count=0
          fresh=""
          for dir in "$src"/*/; do
            [ -d "$dir" ] || continue
            slug=$(basename "$dir")
            mkdir -p "data/$slug"
            for f in conference.json talks.ndjson; do
              if [ -f "$dir$f" ]; then cp "$dir$f" "data/$slug/$f"; fi
            done
            count=$((count + 1))
            fresh="${fresh:+$fresh,}$slug"
          done
          echo "Laid $count conference(s) from the ingest run over data/."
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

      # The demo conference, before any third-party package is installed: its folder under data/ is
      # regenerated for today when config/demo-conference.json switches it on, and removed when it
      # is off (scripts/demo-conference.mjs prepare). A slug the ingest run staged is kept as staged.
      - name: Prepare the demo conference
        id: demo
        env:
          STAGED: ${{ steps.lay.outputs.fresh }}
        run: node scripts/demo-conference.mjs prepare --data data --staged "$STAGED"

      # The embedding library, with no install script: onnxruntime-node's postinstall would
      # download an unverified CUDA provider, and the CPU binaries ship in the package.
      - name: Install the bundle tools
        run: npm --prefix tools/bundles ci --ignore-scripts

      - name: Read the pinned model revision
        id: model
        run: |
          rev=$(grep -oE "ONNX_REVISION = '[0-9a-f]+'" scripts/lib/embedder.mjs | grep -oE "[0-9a-f]{40}")
          if [ -z "$rev" ]; then echo "::error::ONNX_REVISION not found in scripts/lib/embedder.mjs"; exit 1; fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"

      # The model files are SHA-256 pinned and fail closed. With a warm cache the build refuses to
      # download (--no-model-download), so a missing or altered file fails it; on a cache miss it
      # downloads once and the cache is saved at the end of the job.
      - name: Cache the embedding model
        id: model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/model
          key: bundle-model-${{ steps.model.outputs.revision }}

      - name: Build the talk bundles
        env:
          MODEL_FLAG: ${{ steps.model-cache.outputs.cache-hit == 'true' && '--no-model-download' || '' }}
          REUSE_FLAG: ${{ github.event_name == 'schedule' && !inputs.demo_refresh && '--reuse-from none' || '' }}
          LIVE_SINCE: ${{ steps.deployed.outputs.since }}
          FRESH: ${{ steps.lay.outputs.fresh }}
          DEMO_SLUG: ${{ steps.demo.outputs.slug }}
        run: |
          # Never --offline here: it would also forbid reusing the published vectors.
          # --live keeps a live bundle whose schedule is newer than the data here (see above), except
          # the conferences this ingest run staged and the demo conference (--fresh), which always
          # follow the files here.
          live_args=(--live "$BUNDLE_BASE")
          if [ -n "$LIVE_SINCE" ]; then live_args+=(--live-since "$LIVE_SINCE"); fi
          fresh="$FRESH"
          if [ -n "$DEMO_SLUG" ]; then fresh="${fresh:+$fresh,}$DEMO_SLUG"; fi
          if [ -n "$fresh" ]; then live_args+=(--fresh "$fresh"); fi
          node scripts/build-bundles.mjs --out dist-pages --base-url "$BUNDLE_BASE" "${live_args[@]}" $MODEL_FLAG $REUSE_FLAG \
            --takedown "$TAKEDOWN" --publisher-name "$PUBLISHER"

      # A deploy replaces the whole site, but clients may still be fetching the bundle directories
      # the live conferences.json names, so those are copied into this build first (verified by
      # size and SHA-256). A 404 on the first deploy is fine.
      - name: Carry forward the live bundle directories
        run: node scripts/carry-forward-bundles.mjs --out dist-pages --base-url "$BUNDLE_BASE"

      # The landing page reads CADDIE_APP_URL from the environment; an empty value gives the
      # "not live yet" page, and a value that is not a plain https address fails the build.
      - name: Write the landing page
        run: node scripts/pages-landing.mjs --out dist-pages --site-url "$SITE_URL"

      # Only the bundle builder's outputs and the landing page may be published: no app code. The
      # github.io origin is shared with other Pages sites of the same account, so a script published
      # here could read their storage. The check therefore looks below the top level too, rejects
      # every symlink and every other entry that is not a plain file or directory (the artifact is
      # packed with tar --dereference, which would copy what a link points at), and allows under
      # bundles/ only the files the bundle builder writes. This is an early failure: the verify job
      # repeats the checks on the packed artifact, outside the job that ran the third-party code.
      - name: Check the site holds no web app
        run: |
          [ -d dist-pages/bundles ] || { echo "::error::dist-pages/bundles is missing."; exit 1; }
          links=$(find dist-pages -type l -print)
          if [ -n "$links" ]; then echo "::error::Symlinks in dist-pages: $links"; exit 1; fi
          unexpected=$(find dist-pages -mindepth 1 -maxdepth 1 \
            ! -name bundles ! -name conferences.json ! -name capabilities.json ! -name index.html ! -name 404.html -print)
          if [ -n "$unexpected" ]; then echo "::error::Unexpected files in dist-pages: $unexpected"; exit 1; fi
          unexpected=$(find dist-pages -mindepth 1 -maxdepth 1 ! -name bundles ! -type f -print)
          if [ -n "$unexpected" ]; then echo "::error::Top-level entries that are not plain files: $unexpected"; exit 1; fi
          unexpected=$(find dist-pages/bundles -mindepth 1 ! -type d ! -type f -print)
          if [ -n "$unexpected" ]; then echo "::error::Entries under bundles that are not plain files: $unexpected"; exit 1; fi
          unexpected=$(find dist-pages/bundles -mindepth 1 ! -type d -print | sed 's|^dist-pages/||' \
            | grep -vE '^bundles/(conferences\.json|build-info\.json|sources\.json|[^/]+/[0-9a-f]{16}/(bundle\.json|vectors\.i8))$' || true)
          if [ -n "$unexpected" ]; then echo "::error::Unexpected files in dist-pages/bundles: $unexpected"; exit 1; fi
          unexpected=$(find dist-pages/bundles -mindepth 1 -type d -print | sed 's|^dist-pages/||' \
            | grep -vE '^bundles/[^/]+(/[0-9a-f]{16})?$' || true)
          if [ -n "$unexpected" ]; then echo "::error::Unexpected directories in dist-pages/bundles: $unexpected"; exit 1; fi
          # grep exits 0 on a match, 1 on none and 2 on an error such as a missing file, so only 1 passes.
          rc=0
          grep -qiE '<script|[[:space:]]on[a-z]+[[:space:]]*=' dist-pages/index.html dist-pages/404.html || rc=$?
          if [ "$rc" -ne 1 ]; then echo "::error::The landing page must hold no script or event handler (grep status $rc)."; exit 1; fi
          for f in dist-pages/index.html dist-pages/404.html; do
            grep -qF "default-src 'none'" "$f" || { echo "::error::$f has no default-src 'none' policy."; exit 1; }
          done

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-pages

  # Checks the artifact that will be deployed, in a job with no permissions and no repository code, so
  # that a package that ran in the build job cannot have tampered with the check itself. The artifact
  # is a zip holding artifact.tar (upload-pages-artifact); the tar listing is checked first, so a
  # link or device entry is rejected before anything is extracted, then the files are checked again.
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: artifact

      - name: Check the packed site
        run: |
          tar -tvf artifact/artifact.tar | cut -c1 | sort -u > types.txt
          if grep -qvE '^[-d]$' types.txt; then echo "::error::The artifact holds an entry that is not a plain file or directory (a link or a device)."; tar -tvf artifact/artifact.tar | grep -vE '^[-d]'; exit 1; fi
          entries=$(tar -tf artifact/artifact.tar | sed 's|^\./||; s|/$|/|' | grep -vxE '\.?/?|\.' || true)
          unexpected=$(printf '%s\n' "$entries" | grep -vE '/$' \
            | grep -vE '^(index\.html|404\.html|conferences\.json|capabilities\.json|bundles/conferences\.json|bundles/build-info\.json|bundles/sources\.json|bundles/[^/]+/[0-9a-f]{16}/(bundle\.json|vectors\.i8))$' || true)
          if [ -n "$unexpected" ]; then echo "::error::Unexpected files in the artifact: $unexpected"; exit 1; fi
          unexpected=$(printf '%s\n' "$entries" | grep -E '/$' | grep -vE '^bundles/([^/]+/([0-9a-f]{16}/)?)?$' || true)
          if [ -n "$unexpected" ]; then echo "::error::Unexpected directories in the artifact: $unexpected"; exit 1; fi
          mkdir site
          tar -xf artifact/artifact.tar -C site --no-same-owner
          [ -d site/bundles ] || { echo "::error::The artifact has no bundles directory."; exit 1; }
          [ -f site/bundles/conferences.json ] || { echo "::error::The artifact has no bundles/conferences.json."; exit 1; }
          [ -f site/capabilities.json ] || { echo "::error::The artifact has no capabilities.json."; exit 1; }
          rc=0
          grep -qiE '<script|[[:space:]]on[a-z]+[[:space:]]*=' site/index.html site/404.html || rc=$?
          if [ "$rc" -ne 1 ]; then echo "::error::The landing page must hold no script or event handler (grep status $rc)."; exit 1; fi
          for f in site/index.html site/404.html; do
            grep -qF "default-src 'none'" "$f" || { echo "::error::$f has no default-src 'none' policy."; exit 1; }
          done

  deploy:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
