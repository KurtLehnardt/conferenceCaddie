name: Deploy web app to GitHub Pages

# Builds the web app for https://kurtlehnardt.github.io/conferenceCaddie/ and publishes it with the
# official Pages actions. The app calls the Cloudflare Worker API cross-origin; its address is the
# repository variable CADDIE_API_BASE (Settings, Secrets and variables, Actions, Variables). The
# variable holds a public address, not a secret. A build without an API address would call the
# wrong host, so while the variable is empty a push to main only logs a notice and publishes
# nothing (the Worker is not deployed yet), and a manual run fails.
#
# Pages must be enabled once with the source set to "GitHub Actions" (Settings, Pages).

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CADDIE_API_BASE: ${{ vars.CADDIE_API_BASE }}
    outputs:
      ready: ${{ steps.config.outputs.ready }}
    steps:
      - name: Check the API address is set
        id: config
        run: |
          if [ -n "$CADDIE_API_BASE" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::The repository variable CADDIE_API_BASE is empty. Set it to the Worker's https address."
            exit 1
          fi
          echo "::notice::Skipping the Pages deploy: the repository variable CADDIE_API_BASE is empty."
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        if: steps.config.outputs.ready == 'true'
        working-directory: web
        run: npm ci

      - name: Build
        if: steps.config.outputs.ready == 'true'
        working-directory: web
        env:
          VITE_BASE: /conferenceCaddie/
          VITE_API_BASE: ${{ vars.CADDIE_API_BASE }}
          VITE_CLIENT_EXTRACT: '1'
        run: npm run build

      - if: steps.config.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - if: steps.config.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
