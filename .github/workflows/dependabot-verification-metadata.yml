# Dependabot's Gradle updates change only version strings and never regenerate
# native/gradle/verification-metadata.xml, so every native job on such a pull request fails dependency
# verification until somebody regenerates the file (native/README.md, "Dependency verification").
# This workflow does the regeneration in CI. On a pull request that Dependabot opened, it runs the
# documented --write-verification-metadata command on macOS, so the iOS artifacts are covered, and keeps
# the resulting change to the file as an artifact. A maintainer reviews that diff and pushes it. This
# workflow never pushes anything.
#
# The pull request's code is untrusted here, the way it is in native.yml:
# - The trigger is pull_request, never pull_request_target, so the run has the pull request's own
#   privileges. For a run that Dependabot triggers, GitHub gives only a read-only GITHUB_TOKEN and no
#   Actions secrets.
# - The job's token can only read the repository contents. The job uses no secret and no environment.
# - The checkout keeps no credentials.
# - Gradle's cache is off and every other cache is only restored, never saved, so nothing this run
#   resolves can reach another run.
#
# Every action is pinned to a full commit SHA; Dependabot (.github/dependabot.yml) proposes updates.
name: Verification metadata for Dependabot

on:
  pull_request:
    paths:
      - 'native/**'

permissions: {}

concurrency:
  group: dependabot-verification-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate the verification metadata
    # Only pull requests that Dependabot opened, from a branch of this repository. Every other pull
    # request skips the job.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      # Gradle's cache stays off, so the file records everything a new machine downloads. With a
      # warm cache, Gradle reuses parsed POMs and does not record their parent POMs and BOMs.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # Kotlin/Native's toolchain (LLVM and the sysroots; not Maven artifacts, so not in the metadata)
      # and the pinned downloads (SHA-256 checked by the build) are only restored, as on pull requests
      # in native.yml.
      - name: Restore Kotlin/Native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/gradle/libs.versions.toml') }}

      - name: Restore the pinned downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/caddie-pinned
          key: caddie-pinned-${{ runner.os }}-${{ hashFiles('native/gradle/pinned-downloads.properties') }}

      # The command of native/README.md, "Dependency verification".
      - name: Write the verification metadata
        id: write
        run: |
          ./gradlew --write-verification-metadata sha256 --no-configuration-cache --rerun-tasks help checkToolingFloors \
            :shared:allTests :androidApp:assembleDebug :androidApp:assembleRelease \
            :androidApp:assembleDebugAndroidTest :composeApp:assembleAndroidDeviceTest \
            :composeApp:compileTestKotlinIosSimulatorArm64 :composeApp:linkReleaseFrameworkIosArm64 :composeApp:linkDebugFrameworkIosSimulatorArm64 \
            :composeApp:iosArm64ResolveResourcesFromDependencies \
            :composeApp:iosSimulatorArm64ResolveResourcesFromDependencies

      - name: Keep the change to the verification metadata
        id: diff
        if: always()
        run: |
          git diff -- gradle/verification-metadata.xml > "$RUNNER_TEMP/verification-metadata.diff"
          if [ -s "$RUNNER_TEMP/verification-metadata.diff" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          git diff --stat -- gradle/verification-metadata.xml

      - name: Upload the diff
        if: always() && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/verification-metadata.diff
          retention-days: 14

      # The summary uses only values GitHub sets (run and pull request numbers, the repository and the
      # step outcomes) and the component lines of the diff, which hold only Maven coordinates.
      - name: Tell the maintainer how to apply it
        if: always()
        env:
          WRITE_OUTCOME: ${{ steps.write.outcome }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          artifact="verification-metadata-pr-$PR_NUMBER"
          {
            echo "## Verification metadata for pull request #$PR_NUMBER"
            echo
            if [ "$WRITE_OUTCOME" != "success" ]; then
              echo "The Gradle command did not finish ($WRITE_OUTCOME), so any diff below is incomplete. Read the log of"
              echo "\"Write the verification metadata\". A version that no pinned download matches (ONNX Runtime's iOS"
              echo "archive) or an API change in the update needs a fix by hand first."
              echo
            fi
            if [ "$CHANGED" = "true" ]; then
              echo "Components added to \`native/gradle/verification-metadata.xml\`:"
              echo
              echo '```'
              grep -E '^\+ *<component ' "$RUNNER_TEMP/verification-metadata.diff" \
                | sed -E 's/^\+ *<component group="([^"]*)" name="([^"]*)" version="([^"]*)".*/\1:\2:\3/' \
                | grep -E '^[A-Za-z0-9._:+-]+$' || true
              echo '```'
              echo
              echo "To apply it, from the repository root on a checkout of this pull request's branch:"
              echo
              echo '```sh'
              echo "gh run download $RUN_ID -R $REPO -n $artifact -D /tmp/$artifact"
              echo "git apply /tmp/$artifact/verification-metadata.diff"
              echo '```'
              echo
              echo "Then review it as native/README.md (\"Dependency verification\") says: check the new"
              echo "checksums, remove the entries that only the replaced versions needed, run a strict build,"
              echo "and push. A Linux-only artifact is not in this diff; if a Linux job then fails"
              echo "verification, add the entry it names."
            else
              echo "No change to \`native/gradle/verification-metadata.xml\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
