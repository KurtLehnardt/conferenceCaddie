# Refreshes the talks on the free Worker stack and the talk bundles on GitHub Pages from one fetch.
# It discovers the upcoming Linux Foundation events and their Sessionize schedules
# (scripts/ingest.mjs --dry-run, which needs no Elasticsearch) and pushes the result to the Worker's
# admin routes (worker/ingest/push-ingest.mjs). The Worker embeds only talks whose text changed.
# Only the conferences this run fetched are pushed (the "processed" list of ingest.mjs --report):
# ended events drop off the upcoming list, and their data/ folders hold only the committed seed,
# which must not replace what the Worker and the bundles already have.
# Then it publishes the talk bundles of the conferences it pushed, built from the same fetched files:
# scripts/stage-ingest-data.mjs stages exactly what reached the Worker, and the publish job calls
# pages.yml with that artifact, which builds from the current main, verifies and deploys the Pages
# site under the "pages" concurrency group (docs/FREE_HOSTING.md, How data stays fresh). Nothing is committed to the
# repository: data/ in the repository stays a seed, and the live bundles carry a source record
# (bundles/sources.json) that stops a later build from the older committed data from replacing them.
#
# Set once in the repository settings:
#   secret   CADDIE_ADMIN_TOKEN  the Worker's admin token (worker/scripts/setup-secrets.mjs sets it)
#   variable CADDIE_API_BASE     the Worker's URL (the app's URL too), for example https://conference-caddie.<subdomain>.workers.dev
#
# GitHub disables scheduled workflows after 60 days without repository activity. Run this workflow
# by hand to enable it again. Until both values are set, a scheduled run only logs a notice and
# succeeds, so the schedule does not fail every week before the Worker is deployed; a manual run
# fails instead.
# Purging expired profiles does not depend on it (the Worker's cron does).
name: Ingest

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      events:
        description: 'Conference slugs to refresh, separated by spaces. Empty means every upcoming event.'
        required: false
        default: ''
      rebuild_topics:
        description: 'Rebuild each topic list from the titles instead of keeping the stored one (changes topic ids).'
        type: boolean
        required: false
        default: false
      allow_shrink:
        description: 'Let the Worker delete more than 10 talks and more than 10% of a conference (it refuses otherwise, so a short feed cannot erase people sharing for those talks).'
        type: boolean
        required: false
        default: false
      allow_empty:
        description: 'With rebuild_topics, let an empty topic list replace a stored one (the Worker refuses otherwise, since people store topic ids). It applies to every conference in the run, so name the conference in events.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    env:
      EVENTS: ${{ inputs.events }}
      REBUILD_TOPICS: ${{ inputs.rebuild_topics }}
      ALLOW_SHRINK: ${{ inputs.allow_shrink }}
      ALLOW_EMPTY: ${{ inputs.allow_empty }}
      ADMIN_TOKEN: ${{ secrets.CADDIE_ADMIN_TOKEN }}
      CADDIE_API_BASE: ${{ vars.CADDIE_API_BASE }}
    steps:
      - name: Check the configuration
        id: config
        run: |
          missing=""
          if [ -z "$ADMIN_TOKEN" ]; then missing="the CADDIE_ADMIN_TOKEN secret"; fi
          if [ -z "$CADDIE_API_BASE" ]; then missing="${missing:+$missing and }the CADDIE_API_BASE variable"; fi
          if [ -z "$missing" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "::error::$missing is not set."; exit 1; fi
          echo "::notice::Skipping the ingest: $missing is not set (the Worker is not deployed yet)."
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Discover events and build the talk files
        if: steps.config.outputs.ready == 'true'
        run: |
          set -u
          args=()
          for slug in $EVENTS; do args+=(--event "$slug"); done
          if [ "${#args[@]}" -eq 0 ]; then args=(--all-upcoming); fi
          # Exit code 2 means some event ended partial or could not be fetched; the others are still pushed.
          status=0
          node scripts/ingest.mjs "${args[@]}" --dry-run --skip-topics --report "$RUNNER_TEMP/ingest-report.json" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi

      # Only the conferences the step above fetched (--events-from its report), never every folder in
      # data/: the others are the committed seed. The push writes a report of what reached the
      # Worker, also when it fails part way, and its exit status is kept for the last step, so the
      # conferences that were pushed still get their bundles.
      - name: Push to the Worker
        id: push
        if: steps.config.outputs.ready == 'true'
        run: |
          set -u
          args=(--events-from "$RUNNER_TEMP/ingest-report.json")
          if [ "$REBUILD_TOPICS" = "true" ]; then args+=(--rebuild-topics); fi
          if [ "$ALLOW_SHRINK" = "true" ]; then args+=(--allow-shrink); fi
          if [ "$ALLOW_EMPTY" = "true" ]; then args+=(--allow-empty); fi
          status=0
          node worker/ingest/push-ingest.mjs --api "$CADDIE_API_BASE" --report "$RUNNER_TEMP/push-report.json" "${args[@]}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Stage the pushed conference files for the talk bundles
        id: stage
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ ! -f "$RUNNER_TEMP/push-report.json" ]; then
            echo "::warning::The push wrote no report; no talk bundles are published from this run."
            echo "staged=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/stage-ingest-data.mjs --report "$RUNNER_TEMP/push-report.json" --fetched "$RUNNER_TEMP/ingest-report.json" --out "$RUNNER_TEMP/ingest-data"

      - name: Upload the staged conference files
        if: steps.stage.outputs.staged != '' && steps.stage.outputs.staged != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingest-data
          path: ${{ runner.temp }}/ingest-data
          retention-days: 1
          if-no-files-found: error

      - name: Fail when the push failed
        if: steps.push.outputs.status != '' && steps.push.outputs.status != '0'
        env:
          PUSH_STATUS: ${{ steps.push.outputs.status }}
        run: |
          echo "::error::push-ingest.mjs exited with $PUSH_STATUS; the conferences it did push still get their talk bundles."
          exit "$PUSH_STATUS"

  # Builds and deploys the talk bundles of the conferences the ingest job pushed, from the same files,
  # through pages.yml (its build, verify and deploy jobs, under its "pages" concurrency group, which
  # pages.yml's own runs share, so two Pages deploys never overlap). The called build checks out the
  # current main, not this run's commit, so a takedown merged while the ingest ran is applied and
  # an older commit never deploys after a newer one. It runs also when the push failed for some
  # conferences, as long as others were staged. The permissions are the ceiling for the called
  # jobs, which narrow them: only the deploy job gets pages: write and the OIDC token, and the build
  # job reads the Pages deployments (deployments: read) to know when the live site is current.
  publish:
    needs: ingest
    if: ${{ !cancelled() && needs.ingest.outputs.staged != '' && needs.ingest.outputs.staged != '0' }}
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ingest_artifact: ingest-data
